[package]
name = "tracing-serde"
version.workspace = true
authors = ["Tokio Contributors <team@tokio.rs>"]
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage = "https://tokio.rs"
description = """
A compatibility layer for serializing trace data with `serde`
"""
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
    "encoding",
]
keywords = ["logging", "tracing", "serialization"]
rust-version.workspace = true

[features]
valuable = ["valuable_crate", "valuable-serde", "tracing-core/valuable"]

[dependencies]
serde = { workspace = true }
tracing-core = { workspace = true, default-features = true }

[dev-dependencies]
serde_json = { workspace = true }
strict-test-support = { workspace = true }

[target.'cfg(tracing_unstable)'.dependencies]
valuable_crate = { workspace = true, optional = true }
valuable-serde = { workspace = true, optional = true }

# cargo-udeps does not analyze doctests: `serde_json` is exercised only by the
# `src/lib.rs` module doc example, so it is reported as an unused dev-dependency.
[package.metadata.cargo-udeps.ignore]
development = ["serde_json"]

[badges]
maintenance = { status = "experimental" }

[lints]
workspace = true
