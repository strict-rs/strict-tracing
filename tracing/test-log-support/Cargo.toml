[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
parking_lot = { version = "0.12.5" }
strict-test-support = { version = "0.1.0", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main" }

[package]
name = "test-log-support"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
tracing = { path = "..", features = ["log", "log-always"] }
log = { version = "0.4.33", features = ["std"] }
parking_lot.workspace = true
strict-test-support.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(flaky_tests)", "cfg(tracing_unstable)", "cfg(unsound_local_offset)"] }
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
deprecated_safe = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_extern_crates = "deny"
unused_results = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
macro_use_extern_crate = "deny"
absolute_paths_not_starting_with_crate = "deny"
variant_size_differences = "deny"
redundant_lifetimes = "deny"
refining_impl_trait_internal = "deny"
refining_impl_trait_reachable = "deny"
ambiguous_negative_literals = "deny"
async_fn_in_trait = "allow"
missing_copy_implementations = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
invalid_rust_codeblocks = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
as_conversions = "deny"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
cast_ptr_alignment = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast_any = "deny"
ptr_as_ptr = "deny"
borrow_as_ptr = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
integer_division = "deny"
