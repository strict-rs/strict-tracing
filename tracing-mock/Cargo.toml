[package]
name = "tracing-mock"
version = "0.1.0-beta.3"
authors = [
    "Eliza Weisman <eliza@buoyant.io>",
    "Hayden Stainsby <hds@caffeineconcepts.com>",
    "Tokio Contributors <team@tokio.rs>",
]
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage = "https://tokio.rs"
description = """
Utilities for testing `tracing` and crates that uses it.
"""
categories = [
    "development-tools::testing"
]
keywords = [
    "tracing",
    "mock",
    "testing"
]
edition.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = { workspace = true }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"], optional = true }

# Fix minimal-versions; tokio-test fails with otherwise acceptable 0.1.0
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
strict-test-support = { workspace = true, features = ["trybuild"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `tokio-stream` has no direct `tokio_stream` reference in this crate: it exists
# only as a minimal-versions pin so `tokio-test` resolves above its otherwise
# acceptable 0.1.0 (see the dependency comment above), so cargo-machete reports
# it as unused.
[package.metadata.cargo-machete]
ignored = ["tokio-stream"]

[lints]
workspace = true
