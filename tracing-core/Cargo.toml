[package]
name = "tracing-core"
# When releasing to crates.io:
# - Remove path dependencies
# - Update html_root_url.
# - Update doc url in README.md.
# - Update CHANGELOG.md.
# - Create "tracing-core-0.1.x" git tag.
version = "0.1.36"
authors = ["Tokio Contributors <team@tokio.rs>"]
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage = "https://tokio.rs"
description = """
Core primitives for application-level tracing.
"""
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
]
keywords = ["logging", "tracing", "profiling"]
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std", "valuable?/std"]
std = ["dep:parking_lot"]
# Off-by-default subscriber fixtures (the `test_util` module) for exercising the
# crate in tests; requires `std` for thread parking and shared state. Enable only
# from dev-dependencies.
test-util = ["std"]
# used to be an implicit feature from an optional dependency
# FIXME: remove with the next breaking-change release
once_cell = []

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
parking_lot = { workspace = true, optional = true }
spin = { workspace = true }

[dev-dependencies]
strict-test-support = { workspace = true }
# Self dev-dependency: enables the `test-util` feature for this crate's own
# integration tests and doctests without turning it on for downstream builds.
tracing-core = { workspace = true, features = ["test-util"] }

[target.'cfg(tracing_unstable)'.dependencies]
valuable = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
# enable unstable features in the documentation
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tracing_unstable"]
# it's necessary to _also_ pass `--cfg tracing_unstable` to rustc, or else
# dependencies will not be enabled, and the docs build will fail.
rustc-args = ["--cfg", "tracing_unstable"]

# cargo-udeps runs with default features, where `std` is enabled; every `spin::`
# use in this crate is gated `#[cfg(not(feature = "std"))]` (the no-std path:
# `sync.rs` Mutex/MutexGuard, `lib.rs` Once, `dispatcher.rs` GLOBAL_DISPATCH),
# so that run never compiles the spin code and reports `spin` as unused.
[package.metadata.cargo-udeps.ignore]
normal = ["spin"]

[lints]
workspace = true
