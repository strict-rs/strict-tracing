[package]
name = "tracing-subscriber"
version = "0.3.23"
authors = [
    "Eliza Weisman <eliza@buoyant.io>",
    "David Barsky <me@davidbarsky.com>",
    "Tokio Contributors <team@tokio.rs>",
]
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage = "https://tokio.rs"
description = """
Utilities for implementing and composing `tracing` subscribers.
"""
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
]
keywords = ["logging", "tracing", "metrics", "subscriber"]
rust-version.workspace = true

[features]

default = ["smallvec", "fmt", "ansi", "tracing-log", "std"]
alloc = []
std = ["alloc", "tracing-core/std"]
env-filter = ["matchers", "once_cell", "tracing", "std", "thread_local", "dep:regex-automata"]
fmt = ["registry", "std"]
ansi = ["fmt", "nu-ansi-term"]
registry = ["sharded-slab", "thread_local", "std"]
json = ["tracing-serde", "serde", "serde_json"]
valuable = ["tracing-core/valuable", "valuable_crate", "valuable-serde", "tracing-serde/valuable"]
# Enables support for local time when using the `time` crate timestamp
# formatters.
local-time = ["time/local-offset"]
nu-ansi-term = ["dep:nu-ansi-term"]
# For backwards compatibility only
regex = []

[dependencies]
tracing-core = { workspace = true }

# only required by the filter feature
tracing = { workspace = true, optional = true }
matchers = { workspace = true, optional = true }
# required to have matchers::BuildError implement std::error::Error
regex-automata = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# fmt
tracing-log = { workspace = true, optional = true, features = ["log-tracer", "std"] }
nu-ansi-term = { workspace = true, optional = true }
time = { workspace = true, optional = true, default-features = true, features = ["formatting"] }

# only required by the json feature
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing-serde = { workspace = true, optional = true }

# opt-in deps
parking_lot = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# registry
sharded-slab = { workspace = true, optional = true }
thread_local = { workspace = true, optional = true }

[target.'cfg(tracing_unstable)'.dependencies]
valuable_crate = { workspace = true, optional = true }
valuable-serde = { workspace = true, optional = true }

[dev-dependencies]
tracing = { workspace = true, default-features = true }
tracing-mock = { workspace = true, features = ["tracing-subscriber"] }
log = { workspace = true }
tracing-log = { workspace = true, default-features = true }
criterion = { workspace = true }
regex = { workspace = true }
tracing-futures = { workspace = true, features = ["std-future", "std"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# Enable the `time` crate's `macros` feature, for examples.
time = { workspace = true, default-features = true, features = ["formatting", "macros"] }

[badges]
maintenance = { status = "experimental" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "filter_log"
harness = false

[[bench]]
name = "fmt"
harness = false

[[bench]]
name = "enter"
harness = false

[lints]
workspace = true
