[workspace]
resolver = "3"
members = [
    "tracing",
    "tracing-core",
    "tracing-attributes",
    "tracing-error",
    "tracing-flame",
    "tracing-futures",
    "tracing-tower",
    "tracing-log",
    "tracing-macros",
    "tracing-mock",
    "tracing-subscriber",
    "tracing-serde",
    "tracing-test",
    "tracing-appender",
    "tracing-journald",
    "examples"
]
# ─── Default metadata inherited by every member crate ───────────────────────
[workspace.package]
version = "0.3.0"
authors = [
    "Eliza Weisman <eliza@buoyant.io>",
    "Zeki Sherif <zekshi@amazon.com>",
    "David Barsky <dbarsky@amazon.com>",
    "Jane Lusby <jlusby@yaah.dev>",
    "Benjamin Saunders <ben.e.saunders@gmail.com>",
    "Hayden Stainsby <hds@caffeineconcepts.com>",
    "Tokio Contributors <team@tokio.rs>",
    "Takumi Shimada <hello@takumi.earth>"
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
    "no-std",
]
description = "Application-level tracing for Rust."
documentation = "https://docs.rs/tracing"
edition = "2024"
keywords = ["logging", "tracing", "metrics", "async"]
license = "MIT"
repository = "https://github.com/strict-rs/strict-tracing"
rust-version = "1.96"
readme       = "README.md"

[workspace.dependencies]
# Internal crates (path dependencies), pinned to each crate's current version so
# every member inherits a single, consistent version requirement.
tracing = { path = "tracing", version = "0.1.44", default-features = false }
tracing-appender = { path = "tracing-appender", version = "0.2.5" }
tracing-attributes = { path = "tracing-attributes", version = "0.1.31" }
tracing-core = { path = "tracing-core", version = "0.1.36", default-features = false }
tracing-error = { path = "tracing-error", version = "0.2.1" }
tracing-flame = { path = "tracing-flame", version = "0.2.0" }
tracing-futures = { path = "tracing-futures", version = "0.2.5", default-features = false }
tracing-journald = { path = "tracing-journald", version = "0.3.2" }
tracing-log = { path = "tracing-log", version = "0.2.0", default-features = false }
tracing-mock = { path = "tracing-mock", version = "0.1.0-beta.3" }
tracing-serde = { path = "tracing-serde", version = "0.2.0" }
tracing-subscriber = { path = "tracing-subscriber", version = "0.3.23", default-features = false }
tracing-test = { path = "tracing-test", version = "0.1.0" }
tracing-tower = { path = "tracing-tower", version = "0.1.0" }

# External crates. Where an entry sets `default-features = false`, members that
# need the crate's default features opt back in with `default-features = true`
# (Cargo features are additive: a member cannot turn defaults *off* once a
# sibling has them on, so the workspace owns the "off" baseline).
ahash = { version = "0.8.12" }
ansi-to-tui = { version = "8.0.1" }
argh = { version = "0.1.19" }
async-trait = { version = "0.1.89" }
bytes = { version = "1" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
criterion = { version = "0.8.2", default-features = false }
crossbeam-channel = { version = "0.5.15" }
crossterm = { version = "0.29.0" }
futures = { version = "0.3.32", default-features = false }
futures_01 = { package = "futures", version = "=0.1" }
futures-task = { version = "0.3.32" }
http = { version = "1.4.2" }
humantime = { version = "2.3.0" }
hyper = { version = "1.10.1", features = ["full"] }
inferno = { version = "0.12.6" }
libc = { version = "0.2.186" }
log = { version = "0.4.33" }
lru = { version = "0.18.0" }
matchers = { version = "0.2.0" }
mio = { version = "1.2.1" }
nu-ansi-term = { version = "0.50.3" }
once_cell = { version = "1.21.4" }
parking_lot = { version = "0.12.5" }
pin-project-lite = { version = "0.2.17" }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.46" }
rand = { version = "0.10.1" }
ratatui = { version = "0.30.2" }
regex = { version = "1", default-features = false, features = ["std"] }
regex-automata = { version = "0.4", default-features = false, features = ["std"] }
rustversion = { version = "1.0.22" }
serde = { version = "1.0.228" }
serde_json = { version = "1.0.150" }
sharded-slab = { version = "0.1.7" }
smallvec = { version = "1.15.2" }
snafu = { version = "0.9.1" }
symlink = { version = "0.1.0" }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "printing", "visit-mut", "clone-impls", "extra-traits", "proc-macro"] }
tempfile = { version = "3" }
thiserror = { version = "2" }
thread_local = { version = "1.1.9" }
time = { version = "0.3.51", default-features = false }
tokio = { version = "1.52.3" }
tokio_01 = { package = "tokio", version = "=0.1" }
tokio-executor = { version = "0.1.10" }
tokio-stream = { version = "0.1.18" }
tokio-test = { version = "0.4.5" }
tokio-threadpool = { version = "0.1.18" }
tower = { version = "0.5.3", features = ["full"] }
tower-layer = { version = "0.3.3" }
tower_make = { package = "tower-make", version = "0.3.0" }
tower-service = { version = "0.3.3" }
ratatui-textarea = { version = "0.9.2" }
valuable = { version = "0.1.1", default-features = false }
valuable_crate = { package = "valuable", version = "0.1.1", default-features = false }
valuable-serde = { version = "0.1.1", default-features = false }
wasm-bindgen-test = { version = "0.3.75" }

# Compile-diagnostics testing — engine behind `strict_test_support::ensure_compile_fail`
# / `ensure_compiles`, used only through its terminal-free `TestCases::try_run` core.
# Maintained fork, pinned as a direct git dependency (not crates.io + `[patch]`, which
# trybuild strips from the throwaway project it builds). The `version` field keeps it
# from resolving to a `*` wildcard once cargo-deny audits the all-features graph.
trybuild = { git = "ssh://git@github.com/strict-rs/strict-trybuild.git", branch = "strict", version = "1" }

[workspace.lints.rust]
# This will be ignored with Rust older than 1.74, but for now that's okay;
# we're only using it to fix check-cfg issues that first appeared in Rust 1.80.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(flaky_tests)", "cfg(tracing_unstable)", "cfg(unsound_local_offset)"] }
