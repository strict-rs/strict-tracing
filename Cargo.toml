serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", git = "https://github.com/strict-rs/strict-thiserror.git", branch = "upgrade"}
serde_json = "1"
cargo_metadata = "0.23"
ignore = "0.4"
globset = "0.4"
toml = "1.1"
