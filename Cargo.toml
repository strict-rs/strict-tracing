crossbeam-channel = { version = "0.5.16" }
crossterm = { version = "0.29.0" }
futures = { version = "0.3.33", default-features = false }
futures-task = { version = "0.3.33" }
http = { version = "1.4.2" }
humantime = { version = "2.4.0" }
